{% load static %}
<!-- Floating Chatbot Button (Figma Node: Chatbot button 58x58) -->
<button id="chamChatbotFab" type="button" class="cham-chatbot-fab" title="Trò chuyện với Cham Spa" aria-label="Trò chuyện với Cham Spa">
    <i class="bi bi-chat-dots-fill"></i>
</button>

<!-- Cham Spa Chat Window -->
<div id="chamChatWindow" class="cham-chat-window" role="dialog" aria-modal="false" aria-label="Khung trò chuyện Cham Spa">
    <!-- Chat Header -->
    <div class="p-3 text-white d-flex align-items-center justify-content-between" style="background-color: var(--cham-red);">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-white d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
                <i class="bi bi-stars" style="color: var(--cham-red); font-size: 16px;"></i>
            </div>
            <div>
                <div class="fw-bold" style="font-family: var(--font-serif); font-size: 14.5px;">Trợ lý Cham Spa</div>
                <div style="font-size: 11px; opacity: 0.85;">Trực tuyến 24/7</div>
            </div>
        </div>
        <button id="chamChatCloseBtn" type="button" class="btn btn-sm text-white p-0 border-0 fs-5" aria-label="Đóng cửa sổ chat">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Chat Body -->
    <div id="chamChatBody" class="flex-grow-1 p-3 overflow-y-auto d-flex flex-column gap-2" style="background-color: var(--cham-card-bg);">
        <div class="p-2 px-3 rounded-4 bg-white shadow-sm align-self-start border" style="max-width: 85%; font-size: 13.5px; border-bottom-left-radius: 4px; border-color: var(--cham-border-subtle) !important;">
            Xin chào! Cham Spa & Massage có thể hỗ trợ tư vấn dịch vụ trị liệu hoặc đặt lịch hẹn cho quý khách không ạ?
        </div>
    </div>

    <!-- Quick action prompts -->
    <div class="px-3 py-2 bg-white border-top d-flex gap-2 flex-wrap" style="font-size: 12px;">
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-2 border-0" style="background-color: var(--cham-card-bg); font-size: 11.5px;" onclick="document.getElementById('chamChatInput').value='Tư vấn gói trị liệu';">Tư vấn gói trị liệu</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-2 border-0" style="background-color: var(--cham-card-bg); font-size: 11.5px;" onclick="document.getElementById('chamChatInput').value='Đặt lịch hôm nay';">Đặt lịch hôm nay</button>
    </div>

    <!-- Chat Footer -->
    <form id="chamChatForm" class="p-2 px-3 bg-white border-top d-flex gap-2">
        <input id="chamChatInput" type="text" class="form-control form-control-sm rounded-pill px-3" placeholder="Nhập tin nhắn..." autocomplete="off">
        <button type="submit" class="btn btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; background-color: var(--cham-red); color: #ffffff;" aria-label="Gửi">
            <i class="bi bi-send-fill fs-6"></i>
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const fab = document.getElementById('chamChatbotFab');
    const win = document.getElementById('chamChatWindow');
    const closeBtn = document.getElementById('chamChatCloseBtn');
    const form = document.getElementById('chamChatForm');
    const input = document.getElementById('chamChatInput');
    const body = document.getElementById('chamChatBody');

    if (fab && win) {
        fab.addEventListener('click', function () {
            if (win.style.display === 'flex') {
                win.style.display = 'none';
            } else {
                win.style.display = 'flex';
                input.focus();
            }
        });
    }

    if (closeBtn && win) {
        closeBtn.addEventListener('click', function () {
            win.style.display = 'none';
        });
    }

    if (form) {
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            const userBubble = document.createElement('div');
            userBubble.className = 'p-2 px-3 rounded-4 text-white align-self-end';
            userBubble.style.cssText = 'max-width: 85%; font-size: 13.5px; background-color: var(--cham-red); border-bottom-right-radius: 4px;';
            userBubble.textContent = text;
            body.appendChild(userBubble);
            input.value = '';
            body.scrollTop = body.scrollHeight;

            setTimeout(function () {
                const botBubble = document.createElement('div');
                botBubble.className = 'p-2 px-3 rounded-4 bg-white shadow-sm align-self-start border';
                botBubble.style.cssText = 'max-width: 85%; font-size: 13.5px; border-bottom-left-radius: 4px; border-color: var(--cham-border-subtle) !important;';
                botBubble.textContent = 'Cảm ơn quý khách đã quan tâm. Đội ngũ CSKH Cham Spa sẽ phản hồi ngay qua hotline 0987 773 777 ạ!';
                body.appendChild(botBubble);
                body.scrollTop = body.scrollHeight;
            }, 500);
        });
    }
});
</script>
