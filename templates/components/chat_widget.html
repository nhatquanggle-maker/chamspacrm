{% load static %}
{% if not user.is_staff and not user.is_superuser %}
<!-- ========================================================================
     CHAM SPA FLOATING CHAT WIDGET (FIGMA COMPONENT)
     Module 2: Quản lý Boxchat tư vấn - Thành viên phụ trách: Thảo Ngọc
     Quy tắc nghiệp vụ cốt lõi:
       - Phân quyền: STAFF và ADMIN KHÔNG hiển thị chat widget tại homepage.
         Widget chỉ phục vụ Khách hàng (Customer) và Khách vãng lai (Anonymous).
       - Khách hàng đã đăng nhập: Lưu trữ toàn bộ lịch sử trò chuyện trong CSDL,
         tải lại lịch sử cũ khi mở chat widget, hỗ trợ kết nối nhân viên trực tiếp.
       - Khách vãng lai (chưa đăng nhập): Tuyệt đối KHÔNG lưu trữ trong CSDL,
         chỉ chạy in-memory tạm thời trên trình duyệt.
     ======================================================================== -->

<!-- Floating Chatbot Button (Figma Node: Chatbot button 58x58) -->
<button id="chamChatbotFab" type="button" class="cham-chatbot-fab" title="Trò chuyện với Cham Spa" aria-label="Trò chuyện với Cham Spa">
    <i class="bi bi-chat-dots-fill"></i>
</button>

<!-- Cham Spa Chat Window -->
<div id="chamChatWindow" class="cham-chat-window" role="dialog" aria-modal="false" aria-label="Khung trò chuyện Cham Spa">
    <!-- Chat Header -->
    <div class="p-3 text-white d-flex align-items-center justify-content-between" style="background-color: var(--cham-red); border-top-left-radius: 18px; border-top-right-radius: 18px;">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-white d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 36px;">
                <i class="bi bi-stars" style="color: var(--cham-red); font-size: 18px;"></i>
            </div>
            <div>
                <div class="fw-bold" style="font-family: var(--font-serif); font-size: 15px;">Trợ lý Cham Spa</div>
                <div id="widgetStatusIndicator" style="font-size: 11px; opacity: 0.9;">
                    <i class="bi bi-circle-fill text-success" style="font-size: 8px;"></i> Trực tuyến 24/7
                </div>
            </div>
        </div>
        <button id="chamChatCloseBtn" type="button" class="btn btn-sm text-white p-0 border-0 fs-5" aria-label="Đóng cửa sổ chat">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Chat Body -->
    <div id="chamChatBody" class="flex-grow-1 p-3 overflow-y-auto d-flex flex-column gap-2" style="background-color: var(--cham-card-bg); font-family: var(--font-body);">
        <!-- Tin nhắn ban đầu (sẽ được thay thế bằng lịch sử nếu đã đăng nhập) -->
        <div class="p-2 px-3 rounded-4 bg-white shadow-sm align-self-start border" style="max-width: 85%; font-size: 13.5px; border-bottom-left-radius: 4px; border-color: var(--cham-border-subtle) !important; line-height: 1.5;">
            Xin chào! Cham Spa & Massage có thể hỗ trợ tư vấn dịch vụ trị liệu hoặc đặt lịch hẹn cho quý khách không ạ?
        </div>
    </div>

    <!-- Khối chọn câu hỏi FAQ theo kịch bản (đồng bộ 100% từ Admin FAQ) -->
<div id="chamFaqBlocksPanel">
        <div class="cham-faq-header">
            <button type="button" id="chamFaqToggleBtn" class="cham-faq-toggle-btn" onclick="toggleWidgetFaqPanel();">
                <span>📋 Kịch bản FAQ</span>
                <span id="chamFaqCountBadge" style="opacity: 0.85;">(...)</span>
                <span id="chamFaqChevron">▾</span>
            </button>
            <button type="button" class="cham-staff-quick-btn" onclick="handleWidgetRequestStaff();">
                👩‍💼 Gặp nhân viên
            </button>
        </div>
        <div id="chamFaqBlocksBody">
            <div id="chamFaqCatFilter"></div>
            <div id="chamFaqBlocksList">
                <div class="text-muted text-center py-2" style="font-size: 11.5px;">Đang tải kịch bản hỏi đáp...</div>
            </div>
        </div>
    </div>

    <!-- Chat Footer -->
    <form id="chamChatForm" class="p-2 px-3 bg-white border-top d-flex gap-2 align-items-center">
        <input id="chamChatInput" type="text" class="form-control form-control-sm rounded-pill px-3" 
               placeholder="Nhập tin nhắn..." autocomplete="off" style="font-size: 13.5px; height: 38px;">
        <button type="submit" class="btn btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center flex-shrink-0" 
                style="width: 38px; height: 38px; background-color: var(--cham-red); color: #ffffff;" aria-label="Gửi">
            <i class="bi bi-send-fill fs-6"></i>
        </button>
    </form>
</div>

<script>
/**
 * JAVASCRIPT XỬ LÝ CHATBOX WIDGET (MODULE 2 - THẢO NGỌC)
 * Hỗ trợ lưu trữ CSDL cho khách đăng nhập & Không lưu trữ cho khách vãng lai.
 */
document.addEventListener('DOMContentLoaded', function () {
    const fab = document.getElementById('chamChatbotFab');
    const win = document.getElementById('chamChatWindow');
    const closeBtn = document.getElementById('chamChatCloseBtn');
    const form = document.getElementById('chamChatForm');
    const input = document.getElementById('chamChatInput');
    const body = document.getElementById('chamChatBody');
    const statusIndicator = document.getElementById('widgetStatusIndicator');

    const IS_USER_LOGGED_IN = {% if user.is_authenticated %}true{% else %}false{% endif %};
    const CURRENT_USERNAME = "{{ user.name|default:user.username|escapejs }}";
    const WIDGET_CSRF_TOKEN = "{{ csrf_token|escapejs }}";

    let activeConvId = null;
    let isConnectedToStaff = false;
    let widgetPollingTimer = null;
    let hasLoadedHistory = false;
    let historyRenderEpoch = 0;

    // Bật/tắt cửa sổ Chat
    let widgetFaqBlocks = [];
    let activeWidgetFaqCat = 'Tất cả';
    let isFaqBlocksLoaded = false;
    let pendingFaqId = null;

    if (input) {
        input.addEventListener('input', function () {
            pendingFaqId = null;
        });
    }

    function setWidgetFaqPanelCollapsed(collapsed) {
        const bodyEl = document.getElementById('chamFaqBlocksBody');
        const chevronEl = document.getElementById('chamFaqChevron');
        if (!bodyEl || !chevronEl) return;
        if (collapsed) {
            bodyEl.classList.add('is-collapsed');
            chevronEl.textContent = '▴';
        } else {
            bodyEl.classList.remove('is-collapsed');
            chevronEl.textContent = '▾';
        }
    }

    window.toggleWidgetFaqPanel = function () {
        const bodyEl = document.getElementById('chamFaqBlocksBody');
        if (!bodyEl) return;
        const willCollapse = !bodyEl.classList.contains('is-collapsed');
        setWidgetFaqPanelCollapsed(willCollapse);
        if (!willCollapse) {
            loadWidgetFaqBlocks(true);
        }
    };

    window.filterWidgetFaqCat = function (cat) {
        activeWidgetFaqCat = cat;
        renderWidgetFaqPanel();
    };

    function renderWidgetFaqPanel(categoriesFromServer) {
        const catContainer = document.getElementById('chamFaqCatFilter');
        const listContainer = document.getElementById('chamFaqBlocksList');
        const countBadge = document.getElementById('chamFaqCountBadge');
        if (!catContainer || !listContainer) return;

        if (countBadge) {
            countBadge.textContent = '(' + widgetFaqBlocks.length + ')';
        }

        const uniqueCats = categoriesFromServer && categoriesFromServer.length
            ? categoriesFromServer
            : Array.from(new Set(widgetFaqBlocks.map(b => b.category || 'Chung')));

        if (activeWidgetFaqCat !== 'Tất cả' && !uniqueCats.includes(activeWidgetFaqCat)) {
            activeWidgetFaqCat = 'Tất cả';
        }

        catContainer.innerHTML = '';
        ['Tất cả'].concat(uniqueCats).forEach(function (cat) {
            const pill = document.createElement('button');
            pill.type = 'button';
            pill.className = 'cham-faq-cat-pill' + (activeWidgetFaqCat === cat ? ' active' : '');
            pill.textContent = cat;
            pill.addEventListener('click', function () {
                window.filterWidgetFaqCat(cat);
            });
            catContainer.appendChild(pill);
        });

        const filtered = activeWidgetFaqCat === 'Tất cả'
            ? widgetFaqBlocks
            : widgetFaqBlocks.filter(b => (b.category || 'Chung') === activeWidgetFaqCat);

        listContainer.innerHTML = '';
        if (!filtered.length) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'text-muted text-center py-2';
            emptyDiv.style.fontSize = '11.5px';
            emptyDiv.textContent = 'Chưa có kịch bản FAQ đang hoạt động.';
            listContainer.appendChild(emptyDiv);
            return;
        }

        filtered.forEach(function (block) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cham-faq-block-btn';
            btn.dataset.faqId = block.id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'cham-faq-block-content';

            const tagSpan = document.createElement('span');
            tagSpan.className = 'cham-faq-block-tag';
            tagSpan.textContent = block.category || 'Tư vấn';

            const qSpan = document.createElement('span');
            qSpan.className = 'cham-faq-block-question';
            qSpan.textContent = block.question;

            contentDiv.appendChild(tagSpan);
            contentDiv.appendChild(qSpan);

            const arrowSpan = document.createElement('span');
            arrowSpan.className = 'cham-faq-block-arrow';
            arrowSpan.textContent = '›';

            btn.appendChild(contentDiv);
            btn.appendChild(arrowSpan);

            btn.addEventListener('click', function () {
                window.sendWidgetFaqBlock(block.id, block.question);
            });

            listContainer.appendChild(btn);
        });
    }

    function loadWidgetFaqBlocks(forceReload) {
        if (isFaqBlocksLoaded && !forceReload) return;
        fetch('/chatbox/api/chat/faq-blocks/?_t=' + Date.now(), {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.status === 'success') {
                widgetFaqBlocks = data.blocks || [];
                isFaqBlocksLoaded = true;
                renderWidgetFaqPanel(data.categories || []);
            }
        })
        .catch(() => {
            const listContainer = document.getElementById('chamFaqBlocksList');
            if (listContainer && !widgetFaqBlocks.length) {
                listContainer.innerHTML = '<div class="text-muted text-center py-2" style="font-size:11.5px;">Không tải được danh sách FAQ. Quý khách có thể nhập câu hỏi trực tiếp bên dưới.</div>';
            }
        });
    }

    if (fab && win) {
        fab.addEventListener('click', function () {
            if (win.style.display === 'flex') {
                win.style.display = 'none';
            } else {
                win.style.display = 'flex';
                input.focus();
                loadWidgetFaqBlocks(true);

                // NẾU LÀ KHÁCH HÀNG ĐÃ ĐĂNG NHẬP: Tải lịch sử tin nhắn lưu trữ từ CSDL
                if (IS_USER_LOGGED_IN && !hasLoadedHistory) {
                    loadCustomerChatHistory();
                }
            }
        });
    }

    if (closeBtn && win) {
        closeBtn.addEventListener('click', function () {
            win.style.display = 'none';
        });
    }

    // =========================================================================
    // 1. TẢI LỊCH SỬ CHAT CỦA KHÁCH HÀNG TỪ CSDL (CHỈ KHI ĐÃ ĐĂNG NHẬP)
    // =========================================================================
    function loadCustomerChatHistory() {
        fetch('/chatbox/api/conversations/my-active/', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            hasLoadedHistory = true;
            if (data.is_authenticated && data.conversation && data.conversation.status !== 'Kết thúc') {
                activeConvId = data.conversation.id;

                if (data.conversation.status === 'Đang xử lý' && data.conversation.staff_name) {
                    isConnectedToStaff = true;
                    statusIndicator.innerHTML = `<i class="bi bi-headset text-warning"></i> Chuyên viên: <strong>${escapeHtml(data.conversation.staff_name)}</strong>`;
                    startWidgetPolling();
                } else if (data.conversation.status === 'Đang chờ') {
                    isConnectedToStaff = true;
                    statusIndicator.innerHTML = `<i class="bi bi-clock-history text-warning"></i> Đang chờ nhân viên tiếp nhận...`;
                    startWidgetPolling();
                }

                // Render lịch sử tin nhắn đã lưu trong CSDL
                if (data.messages && data.messages.length > 0) {
                    renderHistoryMessages(data.messages);
                }
            }
        })
        .catch(err => console.error('Lỗi tải lịch sử chat:', err));
    }

    function renderHistoryMessages(messages) {
        historyRenderEpoch += 1;
        body.innerHTML = '';
        messages.forEach(msg => {
            if (msg.sender_type === 'Customer') {
                appendUserBubble(msg.content, false);
            } else if (msg.sender_type === 'Staff') {
                appendStaffBubble(msg.content, msg.sender_name || 'Nhân viên tư vấn', false);
            } else {
                appendBotBubble(msg.content, false);
            }
        });
        body.scrollTop = body.scrollHeight;
    }

    // =========================================================================
    // 2. GỬI TIN NHẮN TỪ KHÁCH HÀNG
    // =========================================================================
    if (form) {
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            const reqFaqId = pendingFaqId;
            pendingFaqId = null;

            // 1. Hiển thị tin nhắn người dùng lên màn hình
            appendUserBubble(text, true);
            input.value = '';

            const csrfToken = getCookie('csrftoken') || WIDGET_CSRF_TOKEN;

            // 2. NẾU ĐÃ KẾT NỐI NHÂN VIÊN TƯ VẤN (UC-2.2) VÀ KHÔNG PHẢI BẤM BLOCK FAQ: Gửi vào cuộc hội thoại
            if (isConnectedToStaff && activeConvId && !reqFaqId) {
                fetch(`/chatbox/api/conversations/${activeConvId}/messages/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ content: text, message_type: 'TEXT' })
                })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    // Đã lưu CSDL thành công cho nhân viên nhận
                })
                .catch(err => console.error(err));
                return;
            }

            // 3. NẾU ĐANG CHAT BOT TỰ ĐỘNG HOẶC BẤM CÂU HỎI KỊCH BẢN FAQ (UC-2.1):
            // Khách đăng nhập -> Backend lưu DB; Khách vãng lai -> Backend KHÔNG lưu DB!
            const epochBeforeReply = historyRenderEpoch;
            fetch('/chatbox/api/chat/bot-reply/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({
                    message: text,
                    faq_id: reqFaqId,
                    conversation_id: activeConvId
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(data => {
                if (data.status === 'success' && data.reply) {
                    if (data.conversation_id) {
                        activeConvId = data.conversation_id;
                    }
                    setTimeout(function () {
                        if (epochBeforeReply === historyRenderEpoch) {
                            appendBotBubble(data.reply, true);
                        }
                    }, 350);
                } else {
                    appendBotBubble(data.message || 'Xin lỗi quý khách, hiện chưa tìm thấy câu trả lời phù hợp.', true);
                }
            })
            .catch(err => {
                console.error('Lỗi phản hồi bot:', err);
                appendBotBubble('Xin lỗi quý khách, hệ thống đang bận. Quý khách vui lòng thử lại sau giây lát hoặc liên hệ hotline 0987 773 777 ạ.', true);
            });
        });
    }

    // =========================================================================
    // 3. CÁC HÀM HIỂN THỊ BONG BÓNG CHAT
    // =========================================================================
    function appendUserBubble(text, scroll) {
        const userBubble = document.createElement('div');
        userBubble.className = 'p-2 px-3 rounded-4 text-white align-self-end shadow-sm';
        userBubble.style.cssText = 'max-width: 85%; font-size: 13.5px; background-color: var(--cham-red); border-bottom-right-radius: 4px; line-height: 1.5; word-break: break-word;';
        userBubble.textContent = text;
        body.appendChild(userBubble);
        if (scroll) body.scrollTop = body.scrollHeight;
    }

    function appendBotBubble(text, scroll) {
        const botBubble = document.createElement('div');
        botBubble.className = 'p-2 px-3 rounded-4 bg-white shadow-sm align-self-start border';
        botBubble.style.cssText = 'max-width: 85%; font-size: 13.5px; border-bottom-left-radius: 4px; border-color: var(--cham-border-subtle) !important; line-height: 1.5; word-break: break-word;';
        botBubble.textContent = text;
        body.appendChild(botBubble);
        if (scroll) body.scrollTop = body.scrollHeight;
    }

    function appendStaffBubble(text, staffName, scroll) {
        const staffBubble = document.createElement('div');
        staffBubble.className = 'p-2 px-3 rounded-4 bg-white shadow-sm align-self-start border border-danger-subtle';
        staffBubble.style.cssText = 'max-width: 85%; font-size: 13.5px; border-bottom-left-radius: 4px; line-height: 1.5; word-break: break-word;';
        staffBubble.innerHTML = `
            <div style="font-size: 10.5px; font-weight: 700; color: var(--cham-red); margin-bottom: 2px;">
                <i class="bi bi-headset"></i> ${escapeHtml(staffName)} (Tư vấn viên)
            </div>
            <div>${escapeHtml(text)}</div>
        `;
        body.appendChild(staffBubble);
        if (scroll) body.scrollTop = body.scrollHeight;
    }

    // =========================================================================
    // 4. GẶP NHÂN VIÊN TƯ VẤN (CHUYỂN TIẾP TRỰC TIẾP)
    // =========================================================================
    window.handleWidgetRequestStaff = function () {
        if (!IS_USER_LOGGED_IN) {
            if (confirm('Dạ để được kết nối trực tiếp với nhân viên tư vấn và lưu trữ lịch sử chăm sóc, quý khách vui lòng đăng nhập tài khoản. Bạn có muốn chuyển đến trang Đăng nhập ngay không?')) {
                window.location.href = "{% url 'accounts:login' %}?next=" + encodeURIComponent(window.location.pathname);
            }
            return;
        }

        fetch('/chatbox/api/conversations/transfer/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken') || WIDGET_CSRF_TOKEN,
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ conversation_id: activeConvId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                activeConvId = data.conversation_id;
                isConnectedToStaff = true;
                statusIndicator.innerHTML = `<i class="bi bi-clock-history text-warning"></i> Đang chờ nhân viên tiếp nhận...`;
                appendBotBubble('Yêu cầu của quý khách đã được chuyển tới chuyên viên tư vấn Cham Spa. Chuyên viên sẽ tiếp nhận và phản hồi ngay trong giây lát ạ!', true);
                startWidgetPolling();
            }
        })
        .catch(err => console.error(err));
    };

    window.sendWidgetFaqBlock = function (faqId, questionText) {
        pendingFaqId = faqId;
        input.value = questionText;
        setWidgetFaqPanelCollapsed(true);
        form.dispatchEvent(new Event('submit', { cancelable: true }));
    };

    window.sendWidgetQuickPrompt = function (text) {
        pendingFaqId = null;
        input.value = text;
        form.dispatchEvent(new Event('submit', { cancelable: true }));
    };

    // =========================================================================
    // 5. POLLING TỰ ĐỘNG CẬP NHẬT PHẢN HỒI CỦA NHÂN VIÊN
    // =========================================================================
    function startWidgetPolling() {
        if (widgetPollingTimer) clearInterval(widgetPollingTimer);
        widgetPollingTimer = setInterval(function () {
            if (activeConvId && IS_USER_LOGGED_IN) {
                fetch(`/chatbox/api/conversations/${activeConvId}/messages/`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.staff_info) {
                        statusIndicator.innerHTML = `<i class="bi bi-headset text-success"></i> Chuyên viên: <strong>${escapeHtml(data.staff_info.name)}</strong>`;
                    }
                    if (data && data.messages) {
                        const currentMsgCount = body.querySelectorAll('.p-2').length;
                        if (data.messages.length !== currentMsgCount) {
                            renderHistoryMessages(data.messages);
                        }
                    }
                })
                .catch(() => {});
            }
        }, 3500);
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
</script>
{% endif %}
