{% extends "base.html" %}

{% block layout %}
<div class="champa-watermark-wrapper min-vh-100 py-3 py-md-4">
    <div class="champa-workspace-inner container-fluid px-3 px-md-4">
        <div class="d-flex gap-4">
            <!-- Staff Sidebar (Figma 608:3413) -->
            <div class="d-none d-lg-block flex-shrink-0">
                {% include "components/sidebar_staff.html" %}
            </div>

            <!-- Staff Workspace (Figma 760:751 & 576:825) -->
            <div class="flex-grow-1 overflow-hidden">
                {% block staff_topbar %}
                {% include "components/topbar_workspace.html" %}
                {% endblock %}
                <div class="workspace-content">
                    {% block staff_content %}{% endblock %}
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
